server:
  port: 8080

spring:
  application:
    name: barter-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/barter_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  # 静态资源（前端页面）
  web:
    resources:
      static-locations: classpath:/static/

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.barter.entity
  configuration:
    map-underscore-to-camel-case: true

# AI 助手配置
# 1. enable: true=真实调用 DeepSeek V4 Flash 大模型  false=返回本地模拟回答（降级）
# 2. deepseek.api-key: 到 DeepSeek 开放平台申请 API Key
#    申请地址: https://platform.deepseek.com/api_keys
# 3. deepseek.model: deepseek-v4-flash（快+便宜）或 deepseek-v4-pro（强+稍贵）
# 4. deepseek.base-url: DeepSeek 官方 API 地址
ai:
  enable: true
  deepseek:
    base-url: https://api.deepseek.com
    api-key: sk-dbfbe8ca16b341ba9359ba494ad89a76
    model: deepseek-v4-flash
