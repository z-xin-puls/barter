<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 / 注册 - 校园闲置物品互助交换平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app" v-cloak class="auth-container">
    <div class="auth-box">
        <h2>🎒 校园闲置物品交换平台</h2>
        <div class="tab-switch">
            <button :class="{active: mode === 'login'}" @click="mode = 'login'">登录</button>
            <button :class="{active: mode === 'register'}" @click="mode = 'register'">注册</button>
        </div>

        <!-- 登录表单 -->
        <div v-if="mode === 'login'">
            <div class="form-group">
                <label>账号</label>
                <input type="text" v-model="loginForm.username" placeholder="请输入账号">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" v-model="loginForm.password" placeholder="请输入密码">
            </div>
            <button class="btn btn-primary" style="width:100%" @click="handleLogin" :disabled="loading">
                {{ loading ? '登录中...' : '登 录' }}
            </button>
            <p style="text-align:center; margin-top:16px; color:#aaa; font-size:13px;">
                测试账号：test / 123456
            </p>
        </div>

        <!-- 注册表单 -->
        <div v-if="mode === 'register'">
            <div class="form-group">
                <label>账号 *</label>
                <input type="text" v-model="registerForm.username" placeholder="请输入账号">
            </div>
            <div class="form-group">
                <label>密码 *</label>
                <input type="password" v-model="registerForm.password" placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label>真实姓名</label>
                <input type="text" v-model="registerForm.realName" placeholder="请输入真实姓名（选填）">
            </div>
            <div class="form-group">
                <label>手机号</label>
                <input type="text" v-model="registerForm.phone" placeholder="请输入手机号（选填）">
            </div>
            <div class="form-group">
                <label>学号</label>
                <input type="text" v-model="registerForm.studentNo" placeholder="请输入学号（选填）">
            </div>
            <div class="form-group">
                <label>院系</label>
                <input type="text" v-model="registerForm.department" placeholder="请输入院系（选填）">
            </div>
            <button class="btn btn-primary" style="width:100%" @click="handleRegister" :disabled="loading">
                {{ loading ? '注册中...' : '注 册' }}
            </button>
        </div>
    </div>
</div>

<script src="js/vue.global.js"></script>
<script src="js/common.js"></script>
<script>
    const { createApp, ref } = Vue;

    createApp({
        setup() {
            const mode = ref('login');
            const loading = ref(false);

            const loginForm = ref({
                username: '',
                password: ''
            });

            const registerForm = ref({
                username: '',
                password: '',
                realName: '',
                phone: '',
                studentNo: '',
                department: ''
            });

            // 用户登录
            const handleLogin = async () => {
                if (!loginForm.value.username || !loginForm.value.password) {
                    showToast('请填写完整账号密码', 'error');
                    return;
                }
                loading.value = true;
                try {
                    const res = await httpPost('/api/user/login', loginForm.value);
                    localStorage.setItem('token', res.data.token);
                    localStorage.setItem('userInfo', JSON.stringify({
                        userId: res.data.userId,
                        username: res.data.username,
                        realName: res.data.realName,
                        avatar: res.data.avatar,
                        userType: res.data.userType
                    }));
                    showToast('登录成功，欢迎回来！', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 800);
                } catch (e) {
                    // 错误已在拦截器中处理
                } finally {
                    loading.value = false;
                }
            };

            // 注册
            const handleRegister = async () => {
                if (!registerForm.value.username || !registerForm.value.password) {
                    showToast('账号和密码必填', 'error');
                    return;
                }
                loading.value = true;
                try {
                    await httpPost('/api/user/register', registerForm.value);
                    showToast('注册成功，请登录', 'success');
                    mode.value = 'login';
                    loginForm.value.username = registerForm.value.username;
                    loginForm.value.password = '';
                } catch (e) {
                    // 错误已在拦截器中处理
                } finally {
                    loading.value = false;
                }
            };

            return {
                mode, loading, loginForm, registerForm,
                handleLogin, handleRegister
            };
        }
    }).mount('#app');
</script>
</body>
</html>
